<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - SBI Vendor Resource Onboarding System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Common CSS -->
    <link
        rel="stylesheet"
        href="common.css">

    <style>

        /* =========================
           REGISTER PAGE
           ========================= */

        body {
            overflow: hidden;
             background: #f1f5f9;
    color: #1e293b;
        }
        .register-page {
            min-height: calc(100vh - 120px);

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 0 20px;
        }


        /* =========================
           REGISTER CARD
           ========================= */

        .register-card {
            width: 100%;
            max-width: 800px;

            border: none;
            border-radius: 16px;

            box-shadow:
                0 15px 40px
                rgba(0, 100, 160, 0.20);
        }

        .register-card .card-body {
            padding: 0 35px 25px;
        }


        /* =========================
           TITLE
           ========================= */

        .register-title {
            color: #333;
            font-weight: 700;
        }

        .register-subtitle {
            color: #777;
            font-size: 14px;
        }


        /* =========================
           LABELS
           ========================= */

        .form-label {
            color: #333;
            font-size: 15px;
            font-weight: 700;
        }

        .required {
            color: red;
        }


        /* =========================
           INPUTS
           ========================= */

        .form-control,
        .form-select {
            padding: 8px 11px;

            border-radius: 7px;

            font-size: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 0.2rem
                rgba(56, 189, 248, 0.18);
        }


        /* =========================
           READONLY USERNAME
           ========================= */

        .readonly-field {
            background-color: #e9ecef;
            cursor: not-allowed;
        }


        /* =========================
           GENDER
           ========================= */

        .gender-container {
            min-height: 38px;

            display: flex;
            align-items: center;

            gap: 18px;
        }

        .gender-container .form-check {
            margin: 0;
        }

        .gender-container .form-check-label {
            font-size: 14px;
            cursor: pointer;
        }


        /* =========================
           BUTTON CONTAINER
           ========================= */

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }


        /* =========================
           BUTTONS
           ========================= */

        .register-btn,
        .reset-btn,
        .close-btn {

            width: 120px;

            padding: 8px 15px;

            border-radius: 7px;

            font-size: 15px;

            font-weight: 600;
        }


        /* REGISTER */

        .register-btn {

            background-color: #0284c7;

            border: none;
        }

        .register-btn:hover {

            background-color: #0369a1;
        }


        /* RESET */

        .reset-btn {

            background-color: #6c757d;

            border: none;

            color: white;
        }

        .reset-btn:hover {

            background-color: #545b62;
        }


        /* CLOSE */

        .close-btn {

            background-color: #dc3545;

            border: none;

            color: white;
        }

        .close-btn:hover {

            background-color: #bb2d3b;
        }


        /* =========================
           MESSAGE
           ========================= */

        .message {

            display: none;

            padding: 10px;

            border-radius: 7px;

            font-size: 13px;

            text-align: center;
        }

        .message.error {

            display: block;

            background-color: #ffe5e5;

            color: #c62828;
        }

        .message.success {

            display: block;

            background-color: #e5f8ec;

            color: #218838;
        }

    </style>

</head>


<body>


<!-- =========================
     COMMON HEADER
     ========================= -->

<div id="common-header"></div>

 <!-- =========================
             COMMON SIDEBAR
             ========================= -->

        <div id="common-sidebar"></div>



<!-- =========================
     REGISTER PAGE
     ========================= -->

<div class="register-page">

    <div class="card register-card">

        <div class="card-body">


            <!-- TITLE -->

            <h2 class="text-center register-title mb-2">
                Create Account
            </h2>


            <p class="text-center register-subtitle mb-4">
                Please fill in your details to register
            </p>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message mb-3">
            </div>


            <!-- =========================
                 REGISTER FORM
                 ========================= -->

            <form id="registerForm">

                <div class="row g-3">


                    <!-- 1. NAME -->

                    <div class="col-md-6">

                        <label
                            for="name"
                            class="form-label">

                            Name
                            <span class="required">*</span>

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- 2. DATE OF BIRTH -->

                    <div class="col-md-6">

                        <label
                            for="dob"
                            class="form-label">

                            Date of Birth
                            <span class="required">*</span>

                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="dob"
                            name="dob"
                            required>

                    </div>

                     <!-- GENDER -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Gender
                            <span class="required">*</span>

                        </label>

                        <div class="gender-container">


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="male"
                                    value="Male"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="male">

                                    Male

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="female"
                                    value="Female">

                                <label
                                    class="form-check-label"
                                    for="female">

                                    Female

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="other"
                                    value="Other">

                                <label
                                    class="form-check-label"
                                    for="other">

                                    Other

                                </label>

                            </div>

                        </div>

                    </div>

                    <!-- 3. ROLE -->

                    <div class="col-md-6">

                        <label
                            for="role"
                            class="form-label">

                            Role
                            <span class="required">*</span>

                        </label>

                        <select
                            class="form-select"
                            id="role"
                            name="role"
                            required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="Admin">
                                Admin
                            </option>

                            <option value="Manager">
                                Manager
                            </option>

                            <option value="Employee">
                                Employee
                            </option>

                            <option value="User">
                                User
                            </option>

                        </select>

                    </div>


                    <!-- 4. MODULE -->

                    <div class="col-md-6">

                        <label
                            for="module"
                            class="form-label">

                            Module
                            <span class="required">*</span>

                        </label>

                        <select
                            class="form-select"
                            id="module"
                            name="module"
                            required>

                            <option value="">
                                Select Module
                            </option>

                            <option value="Vendor Management">
                                Vendor Management
                            </option>

                            <option value="Resource Management">
                                Resource Management
                            </option>

                            <option value="Onboarding">
                                Onboarding
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- 5. CONTACT NUMBER -->

                    <div class="col-md-6">

                        <label
                            for="contact"
                            class="form-label">

                            Contact Number
                            <span class="required">*</span>

                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="contact"
                            name="contact"
                            placeholder="Enter contact number"
                            autocomplete="tel"
                            required>

                    </div>


                    <!-- 6. EMAIL ID -->

                    <div class="col-md-6">

                        <label
                            for="email"
                            class="form-label">

                            Email ID
                            <span class="required">*</span>

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- 7. PRMS ID -->

                    <div class="col-md-6">

                        <label
                            for="prmsId"
                            class="form-label">

                            PRMS ID
                            <span class="required">*</span>

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="prmsId"
                            name="prmsId"
                            placeholder="Enter PRMS ID"
                            required>

                    </div>


                    <!-- 8. USERNAME READONLY -->

                    <div class="col-md-6">

                        <label
                            for="username"
                            class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            class="form-control readonly-field"
                            id="username"
                            name="username"
                            value=""
                            readonly>

                    </div>


                   

                </div>


                <!-- =========================
                     ACTION BUTTONS
                     ========================= -->

                <div class="action-buttons mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary register-btn">

                        Register

                    </button>


                    <button
                        type="reset"
                        class="btn reset-btn">

                        Reset

                    </button>


                    <button
                        type="button"
                        class="btn close-btn"
                        id="closeBtn">

                        Close

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>


<!-- =========================
     COMMON FOOTER
     ========================= -->

<div id="common-footer"></div>


<!-- =========================
     COMMON JAVASCRIPT
     ========================= -->

<script src="common.js"></script>


<!-- =========================
     REGISTRATION JAVASCRIPT
     ========================= -->

<script>

    const registerForm =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");


    /* =========================
       SHOW MESSAGE
       ========================= */

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message mb-3 " + type;

    }


    /* =========================
       RESET MESSAGE
       ========================= */

    registerForm.addEventListener(
        "reset",
        function () {

            setTimeout(function () {

                message.textContent = "";

                message.className =
                    "message mb-3";

            }, 0);

        }
    );


    /* =========================
       CLOSE BUTTON
       ========================= */

    document
        .getElementById("closeBtn")
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "login.html";

            }
        );


    /* =========================
       REGISTRATION
       ========================= */

    registerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const dob =
                document
                    .getElementById("dob")
                    .value;


            const role =
                document
                    .getElementById("role")
                    .value;


            const module =
                document
                    .getElementById("module")
                    .value;


            const contact =
                document
                    .getElementById("contact")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const prmsId =
                document
                    .getElementById("prmsId")
                    .value
                    .trim();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const genderElement =
                document.querySelector(
                    'input[name="gender"]:checked'
                );


            const gender =
                genderElement
                    ? genderElement.value
                    : "";


            /* =========================
               API CALL
               ========================= */

            try {

                const response =
                    await fetch(
                        "http://localhost:8080/api/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name:
                                    name,

                                dob:
                                    dob,

                                role:
                                    role,

                                module:
                                    module,

                                contact:
                                    contact,

                                email:
                                    email,

                                prmsId:
                                    prmsId,

                                username:
                                    username,

                                gender:
                                    gender

                            })

                        }
                    );


                const data =
                    await response.json();


                if (data.success === "true") {

                    showMessage(
                        data.message ||
                        "Registration successful.",
                        "success"
                    );

                    registerForm.reset();

                } else {

                    showMessage(
                        data.message ||
                        "Registration failed.",
                        "error"
                    );

                }


            } catch (error) {

                console.error(error);

                showMessage(
                    "Unable to connect to the server.",
                    "error"
                );

            }

        }
    );

</script>


</body>

</html>
