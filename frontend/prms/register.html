<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - SBI Vendor Resource Onboarding System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Common CSS -->
    <link
        rel="stylesheet"
        href="../prms/css/common.css">

        <link
        rel="stylesheet"
        href="../prms/css/register.css">

   

</head>


<body>


<!-- =========================
     COMMON HEADER
     ========================= -->

<div id="common-header"></div>

 <!-- =========================
             COMMON SIDEBAR
             ========================= -->

        <div id="common-sidebar"></div>



<!-- =========================
     REGISTER PAGE
     ========================= -->

<div class="register-page">

    <div class="card register-card">

        <div class="card-body">


            <!-- TITLE -->

            <h2 class="text-center register-title mb-2">
                Create Account
            </h2>


            <p class="text-center register-subtitle mb-4">
                Please fill in your details to register
            </p>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message mb-3">
            </div>


            <!-- =========================
                 REGISTER FORM
                 ========================= -->

            <form id="registerForm">

                <div class="row g-3">


                    <!-- 1. NAME -->

                    <div class="col-md-6">

                        <label
                            for="name"
                            class="form-label">

                            Name
                            <span class="required">*</span>

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- 2. DATE OF BIRTH -->

                    <div class="col-md-6">

                        <label
                            for="dob"
                            class="form-label">

                            Date of Birth
                            <span class="required">*</span>

                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="dob"
                            name="dob"
                            required>

                    </div>

                     <!-- GENDER -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Gender
                            <span class="required">*</span>

                        </label>

                        <div class="gender-container">


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="male"
                                    value="Male"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="male">

                                    Male

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="female"
                                    value="Female">

                                <label
                                    class="form-check-label"
                                    for="female">

                                    Female

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="other"
                                    value="Other">

                                <label
                                    class="form-check-label"
                                    for="other">

                                    Other

                                </label>

                            </div>

                        </div>

                    </div>

                    <!-- 3. ROLE -->

                    <div class="col-md-6">

                        <label
                            for="role"
                            class="form-label">

                            Role
                            <span class="required">*</span>

                        </label>

                        <select
                            class="form-select"
                            id="role"
                            name="role"
                            required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="Admin">
                                Admin
                            </option>

                            <option value="Manager">
                                Manager
                            </option>

                            <option value="Employee">
                                Employee
                            </option>

                            <option value="User">
                                User
                            </option>

                        </select>

                    </div>


                    <!-- 4. MODULE -->

                    <div class="col-md-6">

                        <label
                            for="module"
                            class="form-label">

                            Module
                            <span class="required">*</span>

                        </label>

                        <select
                            class="form-select"
                            id="module"
                            name="module"
                            required>

                            <option value="">
                                Select Module
                            </option>

                            <option value="Vendor Management">
                                Vendor Management
                            </option>

                            <option value="Resource Management">
                                Resource Management
                            </option>

                            <option value="Onboarding">
                                Onboarding
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- 5. CONTACT NUMBER -->

                    <div class="col-md-6">

                        <label
                            for="contact"
                            class="form-label">

                            Contact Number
                            <span class="required">*</span>

                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="contact"
                            name="contact"
                            placeholder="Enter contact number"
                            autocomplete="tel"
                            required>

                    </div>


                    <!-- 6. EMAIL ID -->

                    <div class="col-md-6">

                        <label
                            for="email"
                            class="form-label">

                            Email ID
                            <span class="required">*</span>

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- 7. PRMS ID -->

                    <div class="col-md-6">

                        <label
                            for="prmsId"
                            class="form-label">

                            PRMS ID
                            <span class="required">*</span>

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="prmsId"
                            name="prmsId"
                            placeholder="Enter PRMS ID"
                            required>

                    </div>


                    <!-- 8. USERNAME READONLY -->

                    <div class="col-md-6">

                        <label
                            for="username"
                            class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            class="form-control readonly-field"
                            id="username"
                            name="username"
                            value=""
                            readonly>

                    </div>


                   

                </div>


                <!-- =========================
                     ACTION BUTTONS
                     ========================= -->

                <div class="action-buttons mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary register-btn">

                        Register

                    </button>


                    <button
                        type="reset"
                        class="btn reset-btn">

                        Reset

                    </button>


                    <button
                        type="button"
                        class="btn close-btn"
                        id="closeBtn">

                        Close

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>


<!-- =========================
     COMMON FOOTER
     ========================= -->

<div id="common-footer"></div>


<!-- =========================
     COMMON JAVASCRIPT
     ========================= -->


     <script src="../prms/javascript/common.js"></script>


<script src="../prms/javascript/register.js"></script>






</body>

</html>
