<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - SBI Vendor Resource Onboarding System</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Common Background/Header/Footer CSS -->
    <link
        rel="stylesheet"
        href="common.css">


  


      

<style>

        

      /* =========================
   REGISTER PAGE
   ========================= */

body {
    overflow: hidden;
}

.register-page {
    min-height: calc(100vh - 120px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0px 20px;
}



/* =========================
   REGISTER CARD
   ========================= */


        .register-card {
            width: 100%;
            max-width: 800px;

            border: none;

            border-radius: 16px;

            box-shadow:
                0 15px 40px
                rgba(0, 100, 160, 0.20);
        }


        .register-card .card-body {
            padding: 0px 35px;
           
        }




        /* =========================
           TITLE
           ========================= */

        .register-title {
            color: #333;

            font-weight: 700;
        }


        .register-subtitle {
            color: #777;

            font-size: 14px;
        }


        /* =========================
           LABELS
           ========================= */

        .form-label {
            color: #333;

            font-size: 15px;

            font-weight: 700;
        }


        .required {
            color: red;
        }


        /* =========================
           INPUTS
           ========================= */
.form-control,
.form-select {
    padding: 8px 11px;

    border-radius: 7px;

    font-size: 14px;
}

.mb-3 {
    margin-bottom: 0.5rem !important;
}



        .form-control:focus,
        .form-select:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 0.2rem
                rgba(56, 189, 248, 0.18);
        }


        textarea.form-control {
            min-height: 70px;

            resize: vertical;
        }


        /* =========================
           PASSWORD SHOW/HIDE
           ========================= */

        .show-password {
            color: #0284c7;

            font-size: 12px;

            font-weight: 600;
        }


        .show-password:hover {
            color: #0369a1;
        }


        /* =========================
           GENDER
           ========================= */

        .gender-container {
            min-height: 38px;

            display: flex;

            align-items: center;

            gap: 18px;
        }


        .gender-container .form-check {
            margin: 0;
        }


        .gender-container .form-check-label {
            font-size: 14px;

            cursor: pointer;
        }


        /* =========================
           REGISTER BUTTON
           ========================= */

       .register-btn {
    background-color: #0284c7;

    border: none;

    padding: 9px;

    border-radius: 7px;

    font-size: 18px;

    font-weight: 600;
}



        .register-btn:hover {
            background-color: #0369a1;
        }


        /* =========================
           MESSAGE
           ========================= */

        .message {
            display: none;

            padding: 10px;

            border-radius: 7px;

            font-size: 13px;

            text-align: center;
        }


        .message.error {
            display: block;

            background-color: #ffe5e5;

            color: #c62828;
        }


        .message.success {
            display: block;

            background-color: #e5f8ec;

            color: #218838;
        }


        /* =========================
           BACK TO LOGIN
           ========================= */

        .login-link {
            color: #0284c7;

            text-decoration: none;

            font-size: 18px;

            font-weight: 600;
        }


        .login-link:hover {
            text-decoration: underline;
        }


       

    </style>

        

</head>


<body>


<!-- =========================
         COMMON HEADER
         ========================= -->

    <div id="common-header"></div>


    <!-- =================================
         REGISTER CARD
         ================================= -->

    <div class="register-page">

    <div class="card register-card">


        <div class="card-body">


            <!-- Title -->

            <h2 class="text-center register-title mb-2">
                Create Account
            </h2>


            <p class="text-center register-subtitle mb-4">
                Please fill in your details to register
            </p>


            <!-- Message -->

            <div
                id="message"
                class="message mb-3">
            </div>



            <!-- =================================
                 REGISTER FORM
                 ================================= -->

            <form id="registerForm">


                <div class="row g-3">


                    <!-- Username -->

                    <div class="col-md-6">

                        <label
                            for="username"
                            class="form-label">

                            Username
                            <span class="required">*</span>

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >

                    </div>



                    <!-- Name -->

                    <div class="col-md-6">

                        <label
                            for="name"
                            class="form-label">

                            Name
                            <span class="required">*</span>

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required
                        >

                    </div>



                    <!-- Date of Birth -->

                    <div class="col-md-6">

                        <label
                            for="dob"
                            class="form-label">

                            Date of Birth
                            <span class="required">*</span>

                        </label>


                        <input
                            type="date"
                            class="form-control"
                            id="dob"
                            name="dob"
                            required
                        >

                    </div>



                    <!-- Gender -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Gender
                            <span class="required">*</span>

                        </label>


                        <div class="gender-container">


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="male"
                                    value="Male"
                                    required
                                >

                                <label
                                    class="form-check-label"
                                    for="male">

                                    Male

                                </label>

                            </div>



                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="female"
                                    value="Female"
                                >

                                <label
                                    class="form-check-label"
                                    for="female">

                                    Female

                                </label>

                            </div>



                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="other"
                                    value="Other"
                                >

                                <label
                                    class="form-check-label"
                                    for="other">

                                    Other

                                </label>

                            </div>


                        </div>

                    </div>



                    <!-- Role -->

                    <div class="col-md-6">

                        <label
                            for="role"
                            class="form-label">

                            Role
                            <span class="required">*</span>

                        </label>


                        <select
                            class="form-select"
                            id="role"
                            name="role"
                            required
                        >

                            <option value="">
                                Select Role
                            </option>

                            <option value="Admin">
                                Admin
                            </option>

                            <option value="Manager">
                                Manager
                            </option>

                            <option value="Employee">
                                Employee
                            </option>

                            <option value="User">
                                User
                            </option>

                        </select>

                    </div>



                    <!-- Contact -->

                    <div class="col-md-6">

                        <label
                            for="contact"
                            class="form-label">

                            Contact
                            <span class="required">*</span>

                        </label>


                        <input
                            type="tel"
                            class="form-control"
                            id="contact"
                            name="contact"
                            placeholder="Enter contact number"
                            autocomplete="tel"
                            required
                        >

                    </div>



                    <!-- Email -->

                    <div class="col-md-6">

                        <label
                            for="email"
                            class="form-label">

                            Email
                            <span class="required">*</span>

                        </label>


                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- Password -->

                    <div class="col-md-6">

                        <label
                            for="password"
                            class="form-label">

                            Password
                            <span class="required">*</span>

                        </label>


                        <div class="input-group">

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="btn btn-outline-secondary show-password"
                                data-target="password">

                                Show

                            </button>

                        </div>

                    </div>



                    <!-- Confirm Password -->

                    <div class="col-md-6">

                        <label
                            for="confirmPassword"
                            class="form-label">

                            Confirm Password
                            <span class="required">*</span>

                        </label>


                        <div class="input-group">

                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="btn btn-outline-secondary show-password"
                                data-target="confirmPassword">

                                Show

                            </button>

                        </div>

                    </div>



                    <!-- Address -->

                    <div class="col-12">

                        <label
                            for="address"
                            class="form-label">

                            Address
                            <span class="required">*</span>

                        </label>


                        <textarea
                            class="form-control"
                            id="address"
                            name="address"
                            placeholder="Enter your address"
                            autocomplete="street-address"
                            required
                        ></textarea>

                    </div>


                </div>



                <!-- Register Button -->

                <button
                    type="submit"
                    class="btn btn-primary register-btn w-100 mt-4">

                    Register

                </button>


            </form>



            <!-- Back to Login -->

            <div class="text-center mt-3">

                <a
                    href="login.html"
                    class="login-link">

                    ← Back to Login

                </a>

            </div>


        </div>


    </div>

    <!-- =========================
         COMMON FOOTER
         ========================= -->

    <div id="common-footer"></div>


    <!-- =========================
         COMMON JAVASCRIPT
         ========================= -->

    <script src="common.js"></script>

 


    <!-- =================================
         JAVASCRIPT
         ================================= -->

    <script>


        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");


        /* =========================
           SHOW MESSAGE
           ========================= */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message mb-3 " + type;

        }



        /* =========================
           SHOW / HIDE PASSWORD
           ========================= */

        document
            .querySelectorAll(".show-password")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function () {

                        const target =
                            document.getElementById(
                                this.dataset.target
                            );


                        if (
                            target.type === "password"
                        ) {

                            target.type = "text";

                            this.textContent =
                                "Hide";

                        } else {

                            target.type = "password";

                            this.textContent =
                                "Show";

                        }

                    }
                );

            });



        /* =========================
           REGISTRATION
           ========================= */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const role =
                    document
                        .getElementById("role")
                        .value;


                const dob =
                    document
                        .getElementById("dob")
                        .value;


                const genderElement =
                    document.querySelector(
                        'input[name="gender"]:checked'
                    );


                const gender =
                    genderElement
                        ? genderElement.value
                        : "";


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const contact =
                    document
                        .getElementById("contact")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const address =
                    document
                        .getElementById("address")
                        .value
                        .trim();



                /* Password Match */

                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }



                /* Password Length */

                if (password.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    return;
                }



                /* API */

                try {

                    const response =
                        await fetch(
                            "http://localhost:8080/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    username:
                                        username,

                                    name:
                                        name,

                                    role:
                                        role,

                                    dob:
                                        dob,

                                    gender:
                                        gender,

                                    password:
                                        password,

                                    confirmPassword:
                                        confirmPassword,

                                    contact:
                                        contact,

                                    email:
                                        email,

                                    address:
                                        address

                                })
                            }
                        );


                    const data =
                        await response.json();



                    if (data.success === "true") {

                        showMessage(
                            data.message ||
                            "Registration successful.",
                            "success"
                        );


                        registerForm.reset();


                    } else {

                        showMessage(
                            data.message ||
                            "Registration failed.",
                            "error"
                        );

                    }


                } catch (error) {

                    console.error(error);


                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                }

            }
        );

    </script>


</body>

</html>
