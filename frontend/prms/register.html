<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Account</title>


    <!-- Bootstrap 5 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <!-- Common CSS -->

    <link
        rel="stylesheet"
        href="../prms/css/common.css">


    <!-- Employee / Account CSS -->

    <link
        rel="stylesheet"
        href="../prms/css/employee.css">


</head>


<body>


    <!-- =========================================
         COMMON HEADER
    ========================================== -->

    <div id="common-header"></div>



    <!-- =========================================
         DASHBOARD LAYOUT
    ========================================== -->

    <div class="dashboard-layout">


        <!-- =====================================
             COMMON SIDEBAR
        ====================================== -->

        <div id="common-sidebar"></div>



        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main class="account-page">


            <!-- PAGE HEADER -->

            <div class="account-page-header">


                <div>

                    <h2 id="pageTitle">
                        Create Account
                    </h2>

                    <p id="pageDescription">
                        Create a new vendor account
                    </p>

                </div>



                <!-- RIGHT SIDE ACTION BUTTONS -->

                <div
                    id="accountActions"
                    class="d-flex gap-2">


                    <!-- EDIT -->

                    <button
                        type="button"
                        id="editButton"
                        class="btn btn-primary"
                        onclick="enableEdit()"
                        style="display:none;">

                        <i class="bi bi-pencil me-2"></i>

                        Edit

                    </button>



                    <!-- DELETE -->

                    <button
                        type="button"
                        id="deleteButton"
                        class="btn btn-danger"
                        onclick="openDeleteModal()"
                        style="display:none;">

                        <i class="bi bi-trash me-2"></i>

                        Delete

                    </button>

                </div>

            </div>



            <!-- =====================================
                 FORM CARD
            ====================================== -->

            <div class="account-table-card">


                <form
                    id="accountForm">


                    <div class="p-4">


                        <div class="row g-4">


                            <!-- ACCOUNT NAME -->

                            <div class="col-md-6">

                                <label
                                    for="accountName"
                                    class="form-label">

                                    Account Name

                                    <span class="text-danger">
                                        *
                                    </span>

                                </label>


                                <input
                                    type="text"
                                    id="accountName"
                                    class="form-control"
                                    placeholder="Enter account name"
                                    required>

                            </div>



                            <!-- VENDOR CODE -->

                            <div class="col-md-6">

                                <label
                                    for="vendorCode"
                                    class="form-label">

                                    Vendor Code

                                    <span class="text-danger">
                                        *
                                    </span>

                                </label>


                                <input
                                    type="text"
                                    id="vendorCode"
                                    class="form-control"
                                    placeholder="Enter vendor code"
                                    required>

                            </div>



                            <!-- EMAIL -->

                            <div class="col-md-6">

                                <label
                                    for="email"
                                    class="form-label">

                                    Email

                                    <span class="text-danger">
                                        *
                                    </span>

                                </label>


                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter email"
                                    required>

                            </div>



                            <!-- STATUS -->

                            <div class="col-md-6">

                                <label
                                    for="status"
                                    class="form-label">

                                    Status

                                </label>


                                <select
                                    id="status"
                                    class="form-select">

                                    <option value="Active">
                                        Active
                                    </option>

                                    <option value="Inactive">
                                        Inactive
                                    </option>

                                </select>

                            </div>


                        </div>

                    </div>



                    <!-- FORM FOOTER -->

                    <div
                        class="border-top p-3 d-flex justify-content-end gap-2">


                        <button
                            type="button"
                            class="btn btn-secondary"
                            onclick="goBack()">

                            <i class="bi bi-arrow-left me-2"></i>

                            Back

                        </button>


                        <button
                            type="submit"
                            id="saveButton"
                            class="btn btn-primary">

                            <i class="bi bi-check-circle me-2"></i>

                            Save Account

                        </button>


                    </div>


                </form>

            </div>


        </main>


    </div>



    <!-- =========================================
         COMMON FOOTER
    ========================================== -->

    <div id="common-footer"></div>



    <!-- =========================================
         DELETE MODAL
    ========================================== -->

    <div
        class="modal fade"
        id="deleteModal"
        tabindex="-1">


        <div
            class="modal-dialog modal-dialog-centered">


            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Delete Account
                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    Are you sure you want to delete
                    this account?

                </div>


                <div class="modal-footer">


                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        type="button"
                        class="btn btn-danger"
                        onclick="deleteAccount()">

                        <i class="bi bi-trash me-2"></i>

                        Yes, Delete

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Common JS -->

    <script
        src="../prms/javascript/common.js">
    </script>


    <!-- Register JS -->

    <script
        src="../prms/javascript/register.js">
    </script>


</body>

</html>
