<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PRMS Login</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Common Background/Header/Footer CSS -->
    <link
        rel="stylesheet"
        href="common.css">


    <!-- Login-specific CSS -->
    <link
        rel="stylesheet"
        href="login.css">


        <style>
/* =========================
   LOGIN PAGE
   ========================= */

.login-page {
    min-height: calc(100vh - 130px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 15px;
}


/* =========================
   LOGIN CARD
   ========================= */

.login-card {
    width: 100%;

    max-width: 460px;

    border: none;

    border-radius: 16px;

    background: #ffffff;

    box-shadow:
        0 15px 40px
        rgba(0, 100, 160, 0.20);
}


.login-card .card-body {
    padding: 35px;
}


/* =========================
   LOGIN TITLE
   ========================= */

.login-title {
    color: #0f172a;

    font-size: 28px;

    font-weight: 700;
}


.login-subtitle {
    color: #64748b;

    font-size: 14px;
}


/* =========================
   FORM
   ========================= */

.login-card .form-label {
    color: #334155;

    font-weight: 600;
}


.login-card .form-control {
    min-height: 45px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;
}


.login-card .form-control:focus {
    border-color: #0284c7;

    box-shadow:
        0 0 0 3px
        rgba(2, 132, 199, 0.12);
}


/* =========================
   PASSWORD EYE BUTTON
   ========================= */

#showPassword {
    width: 50px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;
}


/* =========================
   LOGIN BUTTON
   ========================= */

.login-btn {
    min-height: 45px;

    border: none;

    border-radius: 8px;

    font-weight: 600;

    background:
        linear-gradient(
            135deg,
            #0284c7,
            #0369a1
        );
}


.login-btn:hover {
    background:
        linear-gradient(
            135deg,
            #0369a1,
            #075985
        );
}


/* =========================
   LINKS
   ========================= */

.forgot-password,
.register-text a {
    color: #0284c7;

    text-decoration: none;

    font-weight: 600;
}


.forgot-password:hover,
.register-text a:hover {
    color: #0369a1;

    text-decoration: underline;
}


/* =========================
   REQUIRED
   ========================= */

.required {
    color: #dc2626;
}


/* =========================
   MESSAGE
   ========================= */

.message {
    padding: 10px 12px;

    border-radius: 7px;

    font-size: 14px;
}


.message:empty {
    display: none;
}


.message.error {
    color: #991b1b;

    background: #fee2e2;
}


.message.success {
    color: #166534;

    background: #dcfce7;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 576px) {

    .login-page {
        min-height: calc(100vh - 120px);

        padding: 20px 12px;
    }

    .login-card .card-body {
        padding: 25px 20px;
    }

    .login-title {
        font-size: 24px;
    }

}


        </style>

</head>


<body>


    <!-- =========================
         COMMON HEADER
         ========================= -->

    <div id="common-header"></div>


    <!-- =========================
         LOGIN PAGE
         ========================= -->

    

    <!-- =========================
     LOGIN PAGE
     ========================= -->

<main class="login-page">

    <div class="card login-card">

        <div class="card-body">



            <h2 class="text-center login-title mb-2">
                Login
            </h2>


            <p class="text-center login-subtitle mb-4">
                Please login to your account
            </p>


            <!-- Message -->

            <div
                id="message"
                class="message mb-3">
            </div>



            <!-- Login Form -->

            <form id="loginForm">


                <!-- Username -->

                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label">

                        Username
                        <span class="required">*</span>

                    </label>


                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- Password -->
          
               

<!-- Password -->

<div class="mb-3">

    <label for="password" class="form-label">
        Password
        <span class="required">*</span>
    </label>

    <div class="input-group">

        <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            class="btn btn-outline-secondary"
            id="showPassword"
            aria-label="Show password">

            <i class="bi bi-eye"></i>

        </button>

    </div>

</div>





                <!-- Forgot Password -->

                <div class="text-end mb-3">

                    <a
                        href="forgotPwd.html"
                        class="forgot-password">

                        Forgot Password?

                    </a>

                </div>



                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn btn-primary login-btn w-100">

                    Login

                </button>


            </form>



            <!-- Register -->

            <p class="text-center register-text mt-4 mb-0">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>


        </div>

    

    </div>
</main>

    <!-- =========================
         COMMON FOOTER
         ========================= -->

    <div id="common-footer"></div>


    <!-- =========================
         COMMON JAVASCRIPT
         ========================= -->

    <script src="common.js"></script>


    <!-- Login JavaScript -->
    <!-- <script src="login.js"></script> -->
    
    <script>

        const loginForm =
            document.getElementById("loginForm");

        const username =
            document.getElementById("username");

        const password =
            document.getElementById("password");

        const message =
            document.getElementById("message");

        const showPassword =
            document.getElementById("showPassword");


        /* =========================
           MESSAGE
           ========================= */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message mb-3 " + type;

        }


        /* =========================
           SHOW / HIDE PASSWORD
           ========================= */

        // showPassword.addEventListener(
        //     "click",
        //     function () {

        //         if (password.type === "password") {

        //             password.type = "text";

        //             showPassword.textContent =
        //                 "Hide";

        //         } else {

        //             password.type = "password";

        //             showPassword.textContent =
        //                 "Show";

        //         }

        //     }
        // );


       

// const showPassword =
//     document.getElementById("showPassword");

showPassword.addEventListener(
    "click",
    function () {

        if (password.type === "password") {

            password.type = "text";

            showPassword.innerHTML =
                '<i class="bi bi-eye-slash"></i>';

            showPassword.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            password.type = "password";

            showPassword.innerHTML =
                '<i class="bi bi-eye"></i>';

            showPassword.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);



        /* =========================
           LOGIN
           ========================= */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const usernameValue =
                    username.value.trim();

                const passwordValue =
                    password.value.trim();


                /* Username validation */

                if (usernameValue === "") {

                    showMessage(
                        "Please enter your username.",
                        "error"
                    );

                    username.focus();

                    return;
                }


                /* Password validation */

                if (passwordValue === "") {

                    showMessage(
                        "Please enter your password.",
                        "error"
                    );

                    password.focus();

                    return;
                }


                /* Password length */

                if (passwordValue.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    password.focus();

                    return;
                }


                try {

                    const response = await fetch(
                        "http://localhost:8080/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username:
                                    usernameValue,

                                password:
                                    passwordValue

                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (data.success === "true") {

                        showMessage(
                            "Login successful!",
                            "success"
                        );


                        setTimeout(
                            function () {

                                window.location.href =
                                    "dashboard.html";

                            },
                            9000
                        );


                    } else {

                        showMessage(
                            data.message ||
                            "Invalid username or password.",
                            "error"
                        );

                    }


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                }

            }
        );

    </script>

</body>

</html>
