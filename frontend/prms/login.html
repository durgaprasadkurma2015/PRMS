<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">

    <title>PRMS Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Common Background/Header/Footer CSS -->
    <link rel="stylesheet"href="../prms/css/common.css">

      <link rel="stylesheet" href="../prms/css/login.css">

</head>

<body>


    <!-- =========================
         COMMON HEADER
         ========================= -->

    <div id="common-header"></div>



    <!-- =========================
     LOGIN PAGE
     ========================= -->

<main class="login-page">

    <div class="card login-card">

        <div class="card-body">



            <h2 class="text-center login-title mb-2">
                Login
            </h2>


            <p class="text-center login-subtitle mb-4">
                Please login to your account
            </p>


            <!-- Message -->

            <div
                id="message"
                class="message mb-3">
            </div>



            <!-- Login Form -->

            <form id="loginForm">


                <!-- Username -->
<!-- =========================
     USERNAME
     ========================= -->

<div class="mb-3">

    <label
        for="username"
        class="form-label">

        Username
        <span class="required">*</span>

    </label>

    <input
        type="text"
        class="form-control"
        id="username"
        name="username"
        placeholder=" Username"
        autocomplete="username"
        required
        maxlength="10"
        spellcheck="false"
        autocapitalize="none"
    >

    <div
        id="usernameError"
        class="validation-tooltip">
    </div>

</div>




                
          
               

<!-- Password -->

<div class="mb-3">

    <label for="password" class="form-label">
        Password
        <span class="required">*</span>
    </label>

    <div class="password-wrapper">

        <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            
            maxlength="8"
              autocapitalize="none"
        >

        <button
            type="button"
            id="showPassword"
            class="password-eye"
            aria-label="Show password">

            <i class="bi bi-eye"></i>

        </button>

    </div>

    <div
        id="passwordError"
        class="validation-tooltip">
    </div>

</div>


                <!-- Forgot Password -->

                <div class="text-end mb-3">

                    <a
                        href="forgotPwd.html"
                        class="forgot-password">

                        Forgot Password?

                    </a>

                </div>



                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn btn-primary login-btn w-100">

                    Login

                </button>


            </form>






        </div>

    

    </div>
</main>

    <!-- =========================
         COMMON FOOTER
         ========================= -->

    <div id="common-footer"></div>


    <!-- =========================
         COMMON JAVASCRIPT
         ========================= -->

    <script src="../prms/javascript/common.js"></script>


   <!-- Login JavaScript -->
     <script src="../prms/javascript/login.js"></script>
    
   

</body>

</html>
