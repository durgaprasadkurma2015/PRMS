<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .login-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .required {
            color: red;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 22px;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #ffe5e5;
            color: #c62828;
        }

        .message.success {
            display: block;
            background: #e5f8ec;
            color: #218838;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .register-text a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>PRMS</h1>

            <p class="subtitle">
                Please login to your account
            </p>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <!-- Username -->
                <div class="input-group">

                    <label for="username">
                        Username <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password <span class="required">*</span>
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Forgot Password -->
                <div class="form-options">

                    <a
                        href="forgotPwd.html"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- Register -->
            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const username =
            document.getElementById("username");

        const password =
            document.getElementById("password");

        const message =
            document.getElementById("message");

        const showPassword =
            document.getElementById("showPassword");


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        // Show / Hide Password
        showPassword.addEventListener(
            "click",
            function () {

                if (password.type === "password") {

                    password.type = "text";

                    showPassword.textContent = "Hide";

                } else {

                    password.type = "password";

                    showPassword.textContent = "Show";

                }

            }
        );


        // Login validation
       loginForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const usernameValue = username.value.trim();
    const passwordValue = password.value.trim();

    if (usernameValue === "") {
        showMessage("Please enter your username.", "error");
        username.focus();
        return;
    }

    if (passwordValue === "") {
        showMessage("Please enter your password.", "error");
        password.focus();
        return;
    }

    if (passwordValue.length < 6) {
        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );
        password.focus();
        return;
    }

    try {

        const response = await fetch(
            "http://localhost:8080/api/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: usernameValue,
                    password: passwordValue
                })
            }
        );

        const data = await response.json();

        if (data.success === "true") {

         showMessage("Login successful!", "success");

setTimeout(function () {
    window.location.href = "employee.html";
}, 500);



            // Example:
           //  window.location.href = "dashboard.html";

        } else {

            showMessage(
                data.message,
                "error"
            );
        }

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to the server.",
            "error"
        );
    }

});


    </script>

</body>
</html>
