<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SBI Vendor Resource Onboarding System</title>


    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        /* =========================
           PAGE
           ========================= */

        body {
            min-height: 100vh;

            background: linear-gradient(135deg, #595a5f, #764ba2);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }


        /* =========================
           SYSTEM HEADER
           ========================= */

         .system-header {
            width: 100%;
            max-width: 900px;

            text-align: center;

             color: white;

            margin-bottom: 25px;
        }


        .system-header h1 {
            font-size: 25px;
            font-weight: 700;

            margin: 12px 0;
        } 


 



        /* =========================
           LOGIN CARD
           ========================= */

        .login-card {
            width: 100%;
            max-width: 400px;

            border: none;
            border-radius: 16px;

            box-shadow:
                0 15px 40px rgba(0, 100, 160, 0.20);
        }


        .login-card .card-body {
            padding: 35px;
        }


        .login-title {
            color: #333;
            font-weight: 700;
        }


        .login-subtitle {
            color: #777;
            font-size: 14px;
        }


        /* =========================
           FORM
           ========================= */

        .form-label {
            font-weight: 600;
            color: #333;
        }


        .required {
            color: red;
        }


        .form-control {
            padding: 12px 14px;

            border-radius: 8px;
        }


        .form-control:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 0.2rem
                rgba(56, 189, 248, 0.20);
        }


        /* =========================
           PASSWORD SHOW BUTTON
           ========================= */

        .show-password {
            color: #0284c7;

            font-size: 13px;

            font-weight: 600;

            border: none;

            background: transparent;
        }


        .show-password:hover {
            color: #0369a1;
        }


        /* =========================
           FORGOT PASSWORD
           ========================= */

        .forgot-password {
            color: #0284c7;

            text-decoration: none;

            font-size: 14px;
        }


        .forgot-password:hover {
            text-decoration: underline;
        }


        /* =========================
           LOGIN BUTTON
           ========================= */

        .login-btn {
            background-color: #0284c7;

            border: none;

            padding: 12px;

            border-radius: 8px;

            font-weight: 600;
        }


        .login-btn:hover {
            background-color: #0369a1;
        }


        /* =========================
           MESSAGE
           ========================= */

        .message {
            display: none;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }


        .message.error {
            display: block;

            background-color: #ffe5e5;

            color: #c62828;
        }


        .message.success {
            display: block;

            background-color: #e5f8ec;

            color: #218838;
        }


        /* =========================
           REGISTER
           ========================= */

        .register-text {
            color: #777;

            font-size: 14px;
        }


        .register-text a {
            color: #0284c7;

            font-weight: 600;

            text-decoration: none;
        }


        .register-text a:hover {
            text-decoration: underline;
        }


        /* =========================
           SBI WEBSITE
           ========================= */

        .sbi-website {
            margin-top: 20px;

            color: white;

            font-size: 20px;

            font-weight: 600;

            text-align: center;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 576px) {

            .system-header h1 {
                font-size: 18px;
            }

            .login-card .card-body {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================
         SYSTEM HEADER
         ================================== -->

    <div class="system-header">

    <h1>
        SBI VENDOR RESOURCE ONBOARDING SYSTEM
    </h1>

</div>




    <!-- ==================================
         LOGIN CARD
         ================================== -->

    <div class="card login-card">

        <div class="card-body">


            <h2 class="text-center login-title mb-2">
                Login
            </h2>


            <p class="text-center login-subtitle mb-4">
                Please login to your account
            </p>


            <!-- Message -->

            <div
                id="message"
                class="message mb-3">
            </div>



            <!-- Login Form -->

            <form id="loginForm">


                <!-- Username -->

                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label">

                        Username
                        <span class="required">*</span>

                    </label>


                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label">

                        Password
                        <span class="required">*</span>

                    </label>


                    <div class="input-group">

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="btn btn-outline-secondary show-password"
                            id="showPassword">

                            Show

                        </button>

                    </div>

                </div>



                <!-- Forgot Password -->

                <div class="text-end mb-3">

                    <a
                        href="forgotPwd.html"
                        class="forgot-password">

                        Forgot Password?

                    </a>

                </div>



                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn btn-primary login-btn w-100">

                    Login

                </button>


            </form>



            <!-- Register -->

            <p class="text-center register-text mt-4 mb-0">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>


        </div>

    </div>



    <!-- ==================================
         SBI WEBSITE
         ================================== -->

    <div class="sbi-website">
        www.sbi.com
    </div>



    <!-- ==================================
         JAVASCRIPT
         ================================== -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const username =
            document.getElementById("username");

        const password =
            document.getElementById("password");

        const message =
            document.getElementById("message");

        const showPassword =
            document.getElementById("showPassword");


        /* =========================
           MESSAGE
           ========================= */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message mb-3 " + type;

        }


        /* =========================
           SHOW / HIDE PASSWORD
           ========================= */

        showPassword.addEventListener(
            "click",
            function () {

                if (password.type === "password") {

                    password.type = "text";

                    showPassword.textContent =
                        "Hide";

                } else {

                    password.type = "password";

                    showPassword.textContent =
                        "Show";

                }

            }
        );


        /* =========================
           LOGIN
           ========================= */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const usernameValue =
                    username.value.trim();

                const passwordValue =
                    password.value.trim();


                /* Username validation */

                if (usernameValue === "") {

                    showMessage(
                        "Please enter your username.",
                        "error"
                    );

                    username.focus();

                    return;
                }


                /* Password validation */

                if (passwordValue === "") {

                    showMessage(
                        "Please enter your password.",
                        "error"
                    );

                    password.focus();

                    return;
                }


                /* Password length */

                if (passwordValue.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    password.focus();

                    return;
                }


                try {

                    const response = await fetch(
                        "http://localhost:8080/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username:
                                    usernameValue,

                                password:
                                    passwordValue

                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (data.success === "true") {

                        showMessage(
                            "Login successful!",
                            "success"
                        );


                        setTimeout(
                            function () {

                                window.location.href =
                                    "employee.html";

                            },
                            9000
                        );


                    } else {

                        showMessage(
                            data.message ||
                            "Invalid username or password.",
                            "error"
                        );

                    }


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                }

            }
        );

    </script>


</body>

</html>
