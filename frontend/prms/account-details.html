<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Account Details</title>


    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <!-- Common CSS -->
    <link
        rel="stylesheet"
        href="../prms/css/common.css">


    <!-- Employee CSS -->
    <link
        rel="stylesheet"
        href="../prms/css/account-details.css">

</head>


<body>


    <!-- COMMON HEADER -->

    <div id="common-header"></div>


    <!-- DASHBOARD -->

    <div class="dashboard-layout">


        <!-- COMMON SIDEBAR -->

        <div id="common-sidebar"></div>


        <!-- ACCOUNT PAGE -->

        <div class="account-page">


            <!-- PAGE HEADER -->

            <div class="account-page-header">

                <div>

                    <h2>
                        Account Details
                    </h2>

                    <p>
                        View and manage vendor accounts
                    </p>

                </div>


                <!-- CREATE BUTTON -->

                <button
                    type="button"
                    class="btn btn-primary create-account-btn"
                    onclick="openCreateAccount()">

                    <i class="bi bi-plus-circle me-2"></i>

                    Create Account

                </button>

            </div>



            <!-- ACCOUNT TABLE -->

            <div class="account-table-card">

                <div class="table-responsive">

           <table class="table table-hover align-middle account-table">



                        <thead>

                            <tr>

                                  <th>
                                    S.no
                                </th>

                                <th>
                                     PRMS ID
                                </th>

                                <th>
                                    Name
                                </th>

                                <th>
                                    username
                                </th>

                                <th>
                                    Status
                                </th>

                                <th class="action-column">
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="accountTableBody">

                        </tbody>


                    </table>

                </div>

            </div>


        </div>

    </div>



    <script>


        /* =========================================
           DEFAULT DATA
        ========================================= */

        const defaultAccounts = [

            {
                id: 1,
                accountName: "ABC Technologies",
                vendorCode: "VEN001",
                email: "abc",
                status: "Active"
            },

            {
                id: 2,
                accountName: "XYZ Solutions",
                vendorCode: "VEN002",
                email: "xyz@example.com",
                status: "Active"
            },

            {
                id: 3,
                accountName: "Global Services",
                vendorCode: "VEN003",
                email: "global@example.com",
                status: "Inactive"
            },

            {
                id: 4,
                accountName: "Digital Systems",
                vendorCode: "VEN004",
                email: "digital@example.com",
                status: "Active"
            },

            {
                id: 5,
                accountName: "Prime Solutions",
                vendorCode: "VEN005",
                email: "prime@example.com",
                status: "Active"
            }

        ];



        /* =========================================
           GET ACCOUNTS
        ========================================= */

        function getAccounts() {

            const stored =
                localStorage.getItem(
                    "accounts"
                );


            if (stored) {

                return JSON.parse(stored);

            }


            localStorage.setItem(
                "accounts",
                JSON.stringify(
                    defaultAccounts
                )
            );


            return defaultAccounts;

        }



        /* =========================================
           LOAD TABLE
        ========================================= */

        function loadAccountTable() {


            const accounts =
                getAccounts();


            const tbody =
                document.getElementById(
                    "accountTableBody"
                );


            tbody.innerHTML = "";



            accounts.forEach(
                function(account) {


                    const row =
                        document.createElement(
                            "tr"
                        );


                    const statusClass =
                        account.status === "Active"
                            ? "status-active"
                            : "status-inactive";



                    row.innerHTML = `

                        <td>
                            ${account.accountName}
                        </td>


                        <td>
                            ${account.vendorCode}
                        </td>


                        <td>
                            ${account.email}
                        </td>


                        <td>

                            <span
                                class="
                                    account-status
                                    ${statusClass}
                                ">

                                ${account.status}

                            </span>

                        </td>


                        <td
                            class="action-column">


                          <button
    type="button"
    class="btn btn-sm btn-outline-primary view-account-btn"
    title="View Account"
    onclick="viewAccount(${account.id})">

    <i class="bi bi-eye"></i>

</button>



                        </td>

                    `;


                    tbody.appendChild(row);

                }
            );

        }



        /* =========================================
           CREATE ACCOUNT
        ========================================= */

        function openCreateAccount() {

            window.location.href =
                "register.html";

        }



        /* =========================================
           VIEW ACCOUNT
        ========================================= */

        function viewAccount(id) {

            window.location.href =
                `register.html?id=${id}&mode=view`;

        }



        /* =========================================
           INITIALIZE
        ========================================= */

        loadAccountTable();


    </script>

    <script src="../prms/javascript/common.js"></script>


</body>

</html>
