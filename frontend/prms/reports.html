<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PRMS Reports</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Common CSS -->

    <link
        rel="stylesheet"
        href="common.css">


    <!-- Reports CSS -->

    <link
        rel="stylesheet"
        href="reports.css">

        <style>
            /* =========================
   REPORT PAGE
   ========================= */

.report-content {
    padding: 30px !important;
}


/* Sidebar */

.sidebar {
    min-height: calc(100vh - 70px);
}


/* Report table */

.report-content .card {
    width: 100%;
}

.report-content table {
    width: 100%;
}

        </style>

</head>


<body>


    <!-- =========================
         COMMON HEADER
         ========================= -->

    <div id="common-header"></div>



    <!-- =========================
         DASHBOARD LAYOUT
         ========================= -->

   <div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->
        <aside class="col-md-3 col-lg-2 bg-dark text-white sidebar p-3">

            <h4 class="mb-4">
                <i class="bi bi-speedometer2 me-2"></i>
                PRMS Admin
            </h4>

            <ul class="nav nav-pills flex-column gap-2">

                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link text-white">
                        <i class="bi bi-house-door me-2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a href="reports.html" class="nav-link active">
                        <i class="bi bi-file-earmark-text me-2"></i>
                        Reports
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">
                        <i class="bi bi-people me-2"></i>
                        Users
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">
                        <i class="bi bi-gear me-2"></i>
                        Settings
                    </a>
                </li>

                <li class="nav-item">
                    <a href="login.html" class="nav-link text-white">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>


        <!-- RIGHT SIDE CONTENT -->
        <main class="col-md-9 col-lg-10 report-content">

            <div class="mb-4">

                <h2 class="mb-1">
                    Reports
                </h2>

                <p class="text-muted mb-0">
                    Report Status
                </p>

            </div>


            <!-- TABLE -->
            <div class="card shadow-sm border-0">

                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table class="table table-hover table-bordered align-middle mb-0">

                            <thead class="table-primary">

                                <tr>
                                    <th class="text-center">S.No</th>
                                    <th>Maker</th>
                                    <th>Checker</th>
                                    <th class="text-center">Active</th>
                                    <th class="text-center">Pending</th>
                                </tr>

                            </thead>

                            <tbody>

                                <tr>
                                    <td class="text-center">1</td>
                                    <td>Maker 001</td>
                                    <td>Checker 001</td>
                                    <td class="text-center">
                                        <span class="badge bg-success">25</span>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-warning text-dark">5</span>
                                    </td>
                                </tr>

                                <tr>
                                    <td class="text-center">2</td>
                                    <td>Maker 002</td>
                                    <td>Checker 002</td>
                                    <td class="text-center">
                                        <span class="badge bg-success">30</span>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-warning text-dark">8</span>
                                    </td>
                                </tr>

                                <tr>
                                    <td class="text-center">3</td>
                                    <td>Maker 003</td>
                                    <td>Checker 003</td>
                                    <td class="text-center">
                                        <span class="badge bg-success">42</span>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-warning text-dark">12</span>
                                    </td>
                                </tr>

                                <tr>
                                    <td class="text-center">4</td>
                                    <td>Maker 004</td>
                                    <td>Checker 004</td>
                                    <td class="text-center">
                                        <span class="badge bg-success">38</span>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-warning text-dark">7</span>
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>




    <!-- =========================
         COMMON FOOTER
         ========================= -->

    <div id="common-footer"></div>



    <!-- =========================
         COMMON JAVASCRIPT
         ========================= -->

    <script src="common.js"></script>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
