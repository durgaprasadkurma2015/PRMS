<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - SBI Vendor Resource Onboarding System</title>


    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        /* =========================
           PAGE BACKGROUND
           ========================= */

        body {
            min-height: 100vh;

             background: linear-gradient(135deg, #595a5f, #764ba2);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }


        /* =========================
           SYSTEM HEADER
           ========================= */

        .system-header {
            width: 100%;
            max-width: 900px;

            text-align: center;

         color: white;

            margin-bottom: 25px;
        }


        .system-header h1 {
            font-size: 25px;

            font-weight: 700;

            margin: 0;

            letter-spacing: 0.5px;
        }


        /* =========================
           RESET CARD
           ========================= */

        .reset-card {
            width: 100%;
            max-width: 400px;

            border: none;

            border-radius: 16px;

            box-shadow:
                0 15px 40px
                rgba(0, 100, 160, 0.20);
        }


        .reset-card .card-body {
            padding: 35px;
        }


        /* =========================
           TITLE
           ========================= */

        .reset-title {
            color: #333;

            font-weight: 700;
        }


        .reset-subtitle {
            color: #777;

            font-size: 14px;
        }


        /* =========================
           FORM
           ========================= */

        .form-label {
            color: #333;

            font-weight: 600;
        }


        .required {
            color: red;
        }


        .form-control {
            padding: 12px 14px;

            border-radius: 8px;
        }


        .form-control:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 0.2rem
                rgba(56, 189, 248, 0.20);
        }


        /* =========================
           SHOW PASSWORD
           ========================= */

        .show-password {
            color: #0284c7;

            font-size: 13px;

            font-weight: 600;
        }


        .show-password:hover {
            color: #0369a1;
        }


        /* =========================
           RESET BUTTON
           ========================= */

        .reset-btn {
            background-color: #0284c7;

            border: none;

            padding: 12px;

            border-radius: 8px;

            font-weight: 600;
        }


        .reset-btn:hover {
            background-color: #0369a1;
        }


        /* =========================
           MESSAGE
           ========================= */

        .message {
            display: none;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }


        .message.error {
            display: block;

            background-color: #ffe5e5;

            color: #c62828;
        }


        .message.success {
            display: block;

            background-color: #e5f8ec;

            color: #218838;
        }


        /* =========================
           BACK TO LOGIN
           ========================= */

        .back-login {
            color: #0284c7;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        .back-login:hover {
            text-decoration: underline;
        }


        /* =========================
           SBI WEBSITE
           ========================= */

        .sbi-website {
            margin-top: 20px;

            color: #075985;

            font-size: 14px;

            font-weight: 600;

            text-align: center;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 576px) {

            .system-header h1 {
                font-size: 18px;
            }

            .reset-card .card-body {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================
         SYSTEM TITLE
         ================================== -->

    <div class="system-header">

        <h1>
            SBI VENDOR RESOURCE ONBOARDING SYSTEM
        </h1>

    </div>



    <!-- ==================================
         RESET PASSWORD CARD
         ================================== -->

    <div class="card reset-card">

        <div class="card-body">


            <h2 class="text-center reset-title mb-2">
                Reset Password
            </h2>


            <p class="text-center reset-subtitle mb-4">
                Enter your details to create a new password
            </p>


            <!-- Message -->

            <div
                id="message"
                class="message mb-3">
            </div>



            <!-- Reset Form -->

            <form id="resetForm">


                <!-- Username -->

                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label">

                        Username
                        <span class="required">*</span>

                    </label>


                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- New Password -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label">

                        New Password
                        <span class="required">*</span>

                    </label>


                    <div class="input-group">

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="btn btn-outline-secondary show-password"
                            data-target="password">

                            Show

                        </button>

                    </div>

                </div>



                <!-- Confirm Password -->

                <div class="mb-3">

                    <label
                        for="confirmPassword"
                        class="form-label">

                        Confirm Password
                        <span class="required">*</span>

                    </label>


                    <div class="input-group">

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="btn btn-outline-secondary show-password"
                            data-target="confirmPassword">

                            Show

                        </button>

                    </div>

                </div>



                <!-- Reset Button -->

                <button
                    type="submit"
                    class="btn btn-primary reset-btn w-100 mt-2">

                    Reset Password

                </button>


            </form>



            <!-- Back to Login -->

            <div class="text-center mt-4">

                <a
                    href="login.html"
                    class="back-login">

                    ← Back to Login

                </a>

            </div>


        </div>

    </div>



    <!-- ==================================
         SBI WEBSITE
         ================================== -->

    <div class="sbi-website">
        www.sbi.com
    </div>



    <!-- ==================================
         JAVASCRIPT
         ================================== -->

    <script>

        const resetForm =
            document.getElementById("resetForm");

        const username =
            document.getElementById("username");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const message =
            document.getElementById("message");


        /* =========================
           MESSAGE
           ========================= */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message mb-3 " + type;

        }


        /* =========================
           SHOW / HIDE PASSWORD
           ========================= */

        document
            .querySelectorAll(".show-password")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function () {

                        const target =
                            document.getElementById(
                                this.dataset.target
                            );


                        if (target.type === "password") {

                            target.type = "text";

                            this.textContent = "Hide";

                        } else {

                            target.type = "password";

                            this.textContent = "Show";

                        }

                    }
                );

            });


        /* =========================
           RESET PASSWORD
           ========================= */

        resetForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const usernameValue =
                    username.value.trim();

                const passwordValue =
                    password.value;

                const confirmValue =
                    confirmPassword.value;


                /* Username */

                if (usernameValue === "") {

                    showMessage(
                        "Please enter your username.",
                        "error"
                    );

                    username.focus();

                    return;
                }


                /* New Password */

                if (passwordValue === "") {

                    showMessage(
                        "Please enter your new password.",
                        "error"
                    );

                    password.focus();

                    return;
                }


                /* Password Length */

                if (passwordValue.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    password.focus();

                    return;
                }


                /* Confirm Password */

                if (passwordValue !== confirmValue) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    confirmPassword.focus();

                    return;
                }


                try {

                    const response = await fetch(
                        "http://localhost:8080/api/auth/reset-password",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username:
                                    usernameValue,

                                password:
                                    passwordValue,

                                confirmPassword:
                                    confirmValue

                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (data.success === "true") {

                        showMessage(
                            data.message ||
                            "Password reset successfully.",
                            "success"
                        );


                        resetForm.reset();


                    } else {

                        showMessage(
                            data.message ||
                            "Unable to reset password.",
                            "error"
                        );

                    }


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                }

            }
        );

    </script>


</body>

</html>
