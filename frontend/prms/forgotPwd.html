<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

        <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Common CSS -->
    <link
        rel="stylesheet"
        href="common.css">

    <!-- Forgot Password CSS -->
    <link
        rel="stylesheet"
        href="forgotPwd.css">

       
  


</head>



<body>


  <!-- =========================
         COMMON HEADER
         ========================= -->

    <div id="common-header"></div>




    <!-- ==================================
         RESET PASSWORD CARD
         ================================== -->

   <div class="reset-page">

    <div class="card reset-card">

        <div class="card-body">



            <h2 class="text-center reset-title mb-2">
                Reset Password
            </h2>


            <p class="text-center reset-subtitle mb-4">
                Enter your details to create a new password
            </p>


            <!-- Message -->

            <div
                id="message"
                class="message mb-3">
            </div>



            <!-- Reset Form -->

            <form id="resetForm">


                <!-- Username -->

                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label">

                        Username
                        <span class="required">*</span>

                    </label>


                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- New Password -->

               <div class="mb-3">

    <label for="password" class="form-label">
        New Password
        <span class="required">*</span>
    </label>

<div class="password-wrapper">

    <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Enter new password"
        autocomplete="new-password"
        required
    >

    <button
        type="button"
        class="password-eye"
        data-target="password"
        aria-label="Show password">

        <i class="bi bi-eye"></i>

    </button>

</div>


</div>




                <!-- Confirm Password -->

               <div class="mb-3">

    <label for="confirmPassword" class="form-label">
        Confirm Password
        <span class="required">*</span>
    </label>

  <div class="password-wrapper">

    <input
        type="password"
        class="form-control"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        autocomplete="new-password"
        required
    >

    <button
        type="button"
        class="password-eye"
        data-target="confirmPassword"
        aria-label="Show password">

        <i class="bi bi-eye"></i>

    </button>

</div>


</div>



                <!-- Reset Button -->

                <button
                    type="submit"
                    class="btn btn-primary reset-btn w-100 mt-2">

                    Reset Password

                </button>


            </form>



            <!-- Back to Login -->

            <div class="text-center mt-4">

                <a
                    href="login.html"
                    class="back-login">

                    ← Back to Login

                </a>

            </div>


        </div>
</div>
   
 <!-- =========================
         COMMON FOOTER
         ========================= -->

    <div id="common-footer"></div>


    <!-- =========================
         COMMON JAVASCRIPT
         ========================= -->

    <script src="../prms/javascript/common.js"></script>

        <script src="../prms/javascript/forgotPwd.js"></script>


 



    


</body>

</html>
