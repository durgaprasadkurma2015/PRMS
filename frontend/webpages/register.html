<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Vendor Account</title>


<!-- Bootstrap -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


<!-- Bootstrap Icons -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


<!-- Common CSS -->

<link
    rel="stylesheet"
    href="../css/common.css">


<!-- Register CSS -->

<link
    rel="stylesheet"
    href="../css/register.css">

</head> <body>
<!-- HEADER -->

<div id="common-header"></div>


<!-- DASHBOARD -->

<div class="dashboard-layout">


    <!-- SIDEBAR -->

    <div id="common-sidebar"></div>


    <!-- MAIN CONTENT -->

    <main class="dashboard-content">


        <div class="register-page">


            <!-- =================================
                 PAGE HEADER
            ================================= -->

            <div class="register-header">


                <div>

                    <div class="back-link"
                         onclick="goBack()">

                        <i class="bi bi-arrow-left"></i>

                        Back to Accounts

                    </div>


                    <h2 id="pageTitle">
                        Create Account
                    </h2>

                    <p id="pageDescription">
                        Create a new vendor account
                    </p>

                </div>


                <!-- TOP RIGHT ACTIONS -->

                <div
    id="accountActions"
    class="account-actions"
    style="display: none;">

    <button
        type="button"
        class="icon-action edit-action"
        id="editBtn"
        title="Edit Account"
        onclick="enableEdit()">

        <i class="bi bi-pencil"></i>

    </button>

    <button
        type="button"
        class="icon-action delete-action"
        title="Delete Account"
        onclick="deleteCurrentAccount()">

        <i class="bi bi-trash3"></i>

    </button>

</div>
</div>
            <!-- =================================
                 ACCOUNT FORM
            ================================= -->

            <div class="register-card">


                <div class="card-title">

                    <div class="card-title-icon">

                        <i class="bi bi-person-vcard"></i>

                    </div>


                    <div>

                        <h5>
                            Account Information
                        </h5>

                        <span>
                            Vendor account details
                        </span>

                    </div>

                </div>



                <form id="accountForm">


                    <div class="row g-4">


                        <!-- PRMS ID -->

                        <div class="col-md-6">

                            <label class="form-label">
                                PRMS ID
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="prmsId"
                                placeholder="Enter PRMS ID"
                                required>

                        </div>


                        <!-- VENDOR NAME -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Vendor Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="vendorName"
                                placeholder="Enter vendor name"
                                required>

                        </div>

                          <!-- 2. DATE OF BIRTH -->

                    <div class="col-md-6">

                        <label
                            for="dob"
                            class="form-label">

                            Date of Birth
                            <span class="required">*</span>

                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="dob"
                            name="dob"
                            required>

                    </div>

                     <!-- GENDER -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Gender
                            <span class="required">*</span>

                        </label>

                        <div class="gender-container">


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="male"
                                    value="Male"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="male">

                                    Male

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="female"
                                    value="Female">

                                <label
                                    class="form-check-label"
                                    for="female">

                                    Female

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="other"
                                    value="Other">

                                <label
                                    class="form-check-label"
                                    for="other">

                                    Other

                                </label>

                            </div>

                        </div>

                    </div>

                    <!-- 3. ROLE -->

                    <div class="col-md-6">

                        <label
                            for="role"
                            class="form-label">

                            Role
                            <span class="required">*</span>

                        </label>

                        <select
                            class="form-select"
                            id="role"
                            name="role"
                            required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="Admin">
                                Admin
                            </option>

                            <option value="Manager">
                                Manager
                            </option>

                            <option value="Employee">
                                Employee
                            </option>

                            <option value="User">
                                User
                            </option>

                        </select>

                    </div>


                    <!-- 4. MODULE -->

                    <div class="col-md-6">

                        <label
                            for="module"
                            class="form-label">

                            Module
                            <span class="required">*</span>

                        </label>

                        <select
                            class="form-select"
                            id="module"
                            name="module"
                            required>

                            <option value="">
                                Select Module
                            </option>

                            <option value="Vendor Management">
                                Vendor Management
                            </option>

                            <option value="Resource Management">
                                Resource Management
                            </option>

                            <option value="Onboarding">
                                Onboarding
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- 5. CONTACT NUMBER -->

                    <div class="col-md-6">

                        <label
                            for="contact"
                            class="form-label">

                            Contact Number
                            <span class="required">*</span>

                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="contact"
                            name="contact"
                            placeholder="Enter contact number"
                            autocomplete="tel"
                            required>

                    </div>


                    <!-- 6. EMAIL ID -->

                    <div class="col-md-6">

                        <label
                            for="email"
                            class="form-label">

                            Email ID
                            <span class="required">*</span>

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            autocomplete="email"
                            required>

                    </div>


                        <!-- USERNAME -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                placeholder="Enter username"
                                required>

                        </div>



                    </div>



                    <!-- FORM BUTTONS -->

<div id="formButtons" class="form-buttons">

    <!-- RESET BUTTON -->
    <button
        type="reset"
        class="btn btn-secondary">

        <i class="bi bi-arrow-counterclockwise me-1"></i>

        Reset

    </button>


    <!-- CLOSE BUTTON -->
    <button
        type="button"
        class="btn btn-outline-danger"
        onclick="goBack()">

        <i class="bi bi-x-lg me-1"></i>

        Close

    </button>


    <!-- SUBMIT BUTTON -->
    <button
        type="submit"
        class="btn btn-primary">

        <i class="bi bi-check-lg me-1"></i>

        Submit

    </button>

</div>


                </form>


            </div>


        </div>


    </main>


</div>



<!-- JAVASCRIPT -->

<script src="../javascript/register.js"></script>

<script src="../javascript/common.js"></script>

</body> </html>
